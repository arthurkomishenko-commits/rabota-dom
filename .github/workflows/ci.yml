name: CI

# Сборка и проверки — на каждый PR и на push в main.
# Деплой на Pages — только с main (бриф §2: GitHub Pages + Actions).
# LHCI подключается в F3, Zod-гейт и banned-phrases — в F2.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Конвенции и границы слоёв
        run: npm run check:conventions

      - name: Метки-костыли
        run: npm run check:markers

      - name: Бюджеты ассетов
        run: npm run check:budgets

      - name: Контраст AA
        run: npm run check:contrast

      - name: Запрещённые фразы
        run: npm run check:phrases

      - name: Целостность контента
        run: npm run check:content

      - name: Самотест проверок
        run: npm run check:selftest

      - name: Типы
        run: npm run check:types

      - name: Сборка
        run: npm run build

      - name: Конфигурация Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Артефакт Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Деплой на Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v5
